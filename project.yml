# project.yml – XcodeGen Konfiguration für iMail Secure (iOS + macOS)
# Installiere XcodeGen: brew install xcodegen
# Erstelle Projekt:     xcodegen generate --spec project.yml

name: iMailSecure
options:
  bundleIdPrefix: io.imailsecure
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  defaultConfig: Debug
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  postGenCommand: "python3 Tools/patch-storekit-testaction.py && Tools/check-pgp-artifact.sh"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_FILE: Sources/iMailSecure/Resources/Info.plist
    CODE_SIGN_ENTITLEMENTS: Sources/iMailSecure/Resources/iMailSecure.entitlements
    DEVELOPMENT_TEAM: ""   # ← Deine Team-ID eintragen
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_PREVIEWS: YES
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    SWIFT_EMIT_LOC_STRINGS: YES
    DEVELOPMENT_LANGUAGE: de
  configs:
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  # MARK: - iOS Target
  iMailSecure:
    type: application
    platform: iOS
    sources:
      - path: Sources/iMailSecure
        excludes:
          - "**/.DS_Store"
          - "Resources/Info*.plist"     # kommen über INFOPLIST_FILE ins Bundle
          - "Resources/*.entitlements"  # gehören in die Signatur
      # Nur für StoreKit-Tests im Simulator: Die App muss die Konfiguration
      # im Bundle haben, damit SKTestSession sie dem UI-Test zuordnen kann.
      # Der Post-Build-Schritt entfernt sie aus Release-Builds.
      - path: iMailSecure.storekit
        buildPhase: resources
    dependencies:
      - package: SwiftMail
      - package: swift-log
        product: Logging
      # Statische rpgp-FFI (Crypto/pgp-ffi). Muss vor `xcodegen generate`
      # gebaut sein: Tools/build-pgp-ios.sh. Statisch, deshalb nicht einbetten.
      - framework: Crypto/build/PGPKit.xcframework
        embed: false
        codeSign: false
    settings:
      base:
        PRODUCT_NAME: iMailSecure
        PRODUCT_BUNDLE_IDENTIFIER: io.imailsecure.app
    postBuildScripts:
      - name: StoreKit-Testkonfiguration aus Release entfernen
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            rm -f "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/iMailSecure.storekit"
          fi

  # MARK: - macOS Target (geplant)
  iMailSecure-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources/iMailSecure
        excludes:
          - "**/.DS_Store"
          - "Resources/Info*.plist"
          - "Resources/*.entitlements"
    dependencies:
      - package: SwiftMail
      - package: swift-log
        product: Logging
      - framework: Crypto/build/PGPKit.xcframework
        embed: false
        codeSign: false
    settings:
      base:
        PRODUCT_NAME: iMailSecure-macOS
        PRODUCT_BUNDLE_IDENTIFIER: io.imailsecure.app.macos
        INFOPLIST_FILE: Sources/iMailSecure/Resources/Info-macOS.plist
        CODE_SIGN_ENTITLEMENTS: Sources/iMailSecure/Resources/iMailSecure-macOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        LS_MINIMUM_SYSTEM_VERSION: "15.0"

  # MARK: - iOS Tests
  iMailSecureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/iMailSecureTests
    dependencies:
      - target: iMailSecure
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/iMailSecure.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/iMailSecure"

  iMailSecureUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/iMailSecureUITests
      - path: iMailSecure.storekit
        buildPhase: resources
    dependencies:
      - target: iMailSecure
    settings:
      base:
        TEST_TARGET_NAME: iMailSecure
        GENERATE_INFOPLIST_FILE: YES

  # MARK: - macOS Tests (geplant)
  iMailSecure-macOSTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/iMailSecureTests  # gemeinsame Tests
    dependencies:
      - target: iMailSecure-macOS
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/iMailSecure-macOS.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/iMailSecure-macOS"

packages:
  SwiftMail:
    url: https://github.com/Cocoanetics/SwiftMail.git
    revision: 88c45cbd31b347b373f7c87e197be63eb95efbc2  # 1.16.0
  swift-log:
    url: https://github.com/apple/swift-log.git
    from: "1.4.0"

schemes:
  iMailSecure:
    build:
      targets:
        iMailSecure: all
    run:
      config: Debug
      storeKitConfiguration: iMailSecure.storekit
    test:
      config: Debug
      storeKitConfiguration: iMailSecure.storekit
      language: de
      region: DE
      targets:
        - iMailSecureTests
        - iMailSecureUITests
    profile:
      config: Release
    archive:
      config: Release

  iMailSecure-macOS:
    build:
      targets:
        iMailSecure-macOS: all
    run:
      config: Debug
    test:
      config: Debug
      language: de
      region: DE
      targets:
        - iMailSecure-macOSTests
    profile:
      config: Release
    archive:
      config: Release
